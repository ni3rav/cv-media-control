[project]
name = "gesture-media"
version = "0.1.0"
description = "Webcam hand-gesture control for media playback on Linux"
readme = "README.md"
authors = [
    { name = "ni3rav", email = "ni3rav@proton.me" }
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe>=0.10.21",
    "numpy>=1.26",
    "python-mpv>=1.0",
    "PyYAML>=6",
    "jeepney>=0.8",
    "pystray>=0.19",
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
gesture-media = "gesture_media.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
